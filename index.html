<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyTask</title>

  <!-- Each person owns ONE stylesheet. Do not edit anyone else's file. -->
  <link rel="stylesheet" href="css/layout.css">        <!-- Part 5 -->
  <link rel="stylesheet" href="css/progress-card.css"> <!-- Part 2 -->
  <link rel="stylesheet" href="css/add-task.css">      <!-- Part 3 -->
  <link rel="stylesheet" href="css/task-row.css">      <!-- Part 4 -->
</head>
<body>

  <!-- Part 5 styles .page (background, centering on PC) and .app (the phone-sized area) -->
  <main class="page">
    <div class="app">

      <!-- Part 2 styles this card. Part 7 updates #date and #counter -->
      <section class="progress-card">
        <div class="progress-card__text">
          <h1 class="progress-card__title">Todo Done</h1>
          <p class="progress-card__date" id="date">12.09.2025</p>
        </div>
        <div class="progress-card__counter">
          <span id="counter">5/8</span>
        </div>
      </section>

      <!-- Part 3 styles the bar. Part 6 uses #task-input and #add-button -->
      <div class="add-task">
        <input class="add-task__input" id="task-input" type="text" placeholder="inpute a new task">
        <button class="add-task__button" id="add-button" type="button" aria-label="Add task">+</button>
      </div>

      <!-- Part 4 styles each .task-row. Part 6 adds new rows to #task-list -->
      <ul class="task-list" id="task-list">

        <li class="task-row">
          <label class="task-row__left">
            <input class="task-row__checkbox" type="checkbox" checked>
            <span class="task-row__text">Text</span>
          </label>
          <button class="task-row__menu" type="button" aria-label="Task options">&#8942;</button>
        </li>

        <li class="task-row">
          <label class="task-row__left">
            <input class="task-row__checkbox" type="checkbox">
            <span class="task-row__text">Text</span>
          </label>
          <button class="task-row__menu" type="button" aria-label="Task options">&#8942;</button>
        </li>

        <li class="task-row">
          <label class="task-row__left">
            <input class="task-row__checkbox" type="checkbox" checked>
            <span class="task-row__text">Text</span>
          </label>
          <button class="task-row__menu" type="button" aria-label="Task options">&#8942;</button>
        </li>

        <li class="task-row">
          <label class="task-row__left">
            <input class="task-row__checkbox" type="checkbox" checked>
            <span class="task-row__text">Text</span>
          </label>
          <button class="task-row__menu" type="button" aria-label="Task options">&#8942;</button>
        </li>

        <li class="task-row">
          <label class="task-row__left">
            <input class="task-row__checkbox" type="checkbox">
            <span class="task-row__text">Text</span>
          </label>
          <button class="task-row__menu" type="button" aria-label="Task options">&#8942;</button>
        </li>

        <li class="task-row">
          <label class="task-row__left">
            <input class="task-row__checkbox" type="checkbox" checked>
            <span class="task-row__text">Text</span>
          </label>
          <button class="task-row__menu" type="button" aria-label="Task options">&#8942;</button>
        </li>

        <li class="task-row">
          <label class="task-row__left">
            <input class="task-row__checkbox" type="checkbox">
            <span class="task-row__text">Text</span>
          </label>
          <button class="task-row__menu" type="button" aria-label="Task options">&#8942;</button>
        </li>

        <li class="task-row">
          <label class="task-row__left">
            <input class="task-row__checkbox" type="checkbox" checked>
            <span class="task-row__text">Text</span>
          </label>
          <button class="task-row__menu" type="button" aria-label="Task options">&#8942;</button>
        </li>

      </ul>
    </div>
  </main>

  <!-- Each person owns ONE script. -->
  <script src="js/add-task.js" defer></script>  <!-- Part 6 -->
  <script src="js/progress.js" defer></script>  <!-- Part 7 -->
</body>
</html>
